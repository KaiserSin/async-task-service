name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and build JAR
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Build image from tested JAR
        run: docker build --target ci --tag task-application:${{ github.sha }} .

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          scan-type: image
          image-ref: task-application:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore
          exit-code: '1'
          format: table
          output: target/trivy-report.txt
          timeout: 10m

      - name: Save reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-reports
          path: |
            target/surefire-reports/
            target/trivy-report.txt
          if-no-files-found: ignore
          retention-days: 7
