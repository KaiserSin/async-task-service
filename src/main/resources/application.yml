spring:
  application:
    name: task-application
  lifecycle:
    timeout-per-shutdown-phase: 5s
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskdb}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 5000
      max-lifetime: 1200000
      validation-timeout: 2000
      leak-detection-threshold: 60000
      transaction-isolation: TRANSACTION_READ_COMMITTED
      register-mbeans: true
      pool-name: TaskServicePool
      data-source-properties:
        connectTimeout: 5
        socketTimeout: 10
        options: "-c statement_timeout=5000 -c lock_timeout=2000"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    postgresql:
      transactional-lock: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: task-group

worker:
  pool:
    size: 4
  poll-delay-ms: 1000
  recovery-delay-ms: 5000
  metrics-delay-ms: 60000
  claim-timeout-seconds: 5
  lease-seconds: 30
  retry-backoff-seconds: 30
  shutdown:
    grace-period-seconds: 75
    interrupt-wait-seconds: 10
  cleanup:
    retention-days: 30
    failed-retention-days: 90
    batch-size: 500
    cron: "0 0 */12 * * *"

kafka:
  topic: tasks
  listener:
    concurrency: 1
    database-retry-delay-ms: 10000

api:
  security:
    users:
      - username: ${TASK_API_USERNAME:user}
        password: ${TASK_API_PASSWORD:}
        roles: [USER]
      - username: ${TASK_API_ADMIN_USERNAME:admin}
        password: ${TASK_API_ADMIN_PASSWORD:}
        roles: [ADMIN]

server:
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: "*"
        liveness:
          include: livenessState
